<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="disc" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#1E4A8C"/>
      <stop offset="1" stop-color="#0C2756"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6C453"/>
      <stop offset="1" stop-color="#D9952A"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3E6EB"/>
      <stop offset="1" stop-color="#B9BEC7"/>
    </linearGradient>
    <clipPath id="lensClip"><circle cx="240" cy="226" r="92"/></clipPath>
  </defs>

  <!-- emblem -->
  <circle cx="256" cy="256" r="236" fill="#3B7BC8"/>
  <circle cx="256" cy="256" r="222" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#6FA6E0" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity=".7"/>

  <!-- sparkle dots -->
  <circle cx="132" cy="130" r="8" fill="#6FA6E0"/>
  <circle cx="158" cy="108" r="6" fill="#6FA6E0"/>
  <circle cx="112" cy="162" r="5" fill="#6FA6E0"/>
  <path d="M380 128 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z" fill="url(#gold)"/>

  <!-- handle -->
  <path d="M176 296 L112 360" stroke="#0A1F45" stroke-width="44" stroke-linecap="round" opacity=".35" transform="translate(4 6)"/>
  <path d="M176 296 L112 360" stroke="#6FA6E0" stroke-width="40" stroke-linecap="round"/>
  <path d="M176 296 L112 360" stroke="#3B7BC8" stroke-width="22" stroke-linecap="round"/>

  <!-- lens -->
  <circle cx="240" cy="226" r="92" fill="#123A75"/>
  <g clip-path="url(#lensClip)">
    <circle cx="240" cy="226" r="92" fill="#1A4A8E"/>
    <!-- key -->
    <g transform="rotate(-38 244 228)">
      <circle cx="210" cy="228" r="34" fill="url(#gold)"/>
      <circle cx="204" cy="222" r="11" fill="#1A4A8E"/>
      <rect x="236" y="216" width="80" height="24" rx="6" fill="url(#gold)"/>
      <rect x="280" y="236" width="14" height="20" rx="3" fill="url(#gold)"/>
      <rect x="300" y="236" width="12" height="14" rx="3" fill="url(#gold)"/>
    </g>
    <!-- glass shine -->
    <path d="M176 186 a 72 72 0 0 1 52 -42" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  </g>
  <circle cx="240" cy="226" r="92" fill="none" stroke="#6FA6E0" stroke-width="20"/>
  <circle cx="240" cy="226" r="80" fill="none" stroke="#9CC4EE" stroke-width="3" opacity=".6"/>

  <!-- suitcase -->
  <g transform="translate(296 286)">
    <rect x="0" y="22" width="132" height="98" rx="18" fill="#0A1F45" opacity=".3" transform="translate(4 6)"/>
    <path d="M44 22 v-10 a10 10 0 0 1 10 -10 h24 a10 10 0 0 1 10 10 v10" fill="none" stroke="#9AA1AD" stroke-width="10"/>
    <rect x="0" y="22" width="132" height="98" rx="18" fill="url(#bag)" stroke="#9AA1AD" stroke-width="5"/>
    <path d="M34 26 v90 M98 26 v90" stroke="#9AA1AD" stroke-width="6"/>
    <!-- luggage tag -->
    <path d="M14 10 C 4 30, 6 44, 18 56" fill="none" stroke="#6B7280" stroke-width="3"/>
    <g transform="rotate(-22 22 76)">
      <path d="M6 58 h28 l10 14 v26 a6 6 0 0 1 -6 6 h-32 a6 6 0 0 1 -6 -6 v-34 a6 6 0 0 1 6 -6z" fill="url(#gold)"/>
      <circle cx="26" cy="68" r="4" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
