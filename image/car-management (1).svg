<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="disc" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#1E4A8C"/>
      <stop offset="1" stop-color="#0C2756"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6C453"/>
      <stop offset="1" stop-color="#D9952A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C453"/>
      <stop offset="1" stop-color="#D9952A"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3E6EB"/>
      <stop offset="1" stop-color="#B9BEC7"/>
    </linearGradient>
  </defs>

  <!-- emblem -->
  <circle cx="256" cy="256" r="236" fill="#3B7BC8"/>
  <circle cx="256" cy="256" r="222" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#6FA6E0" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity=".7"/>

  <!-- gear behind -->
  <g transform="translate(256 214)" fill="#2A5DA6">
    <circle r="108"/>
    <g id="t"><rect x="-18" y="-136" width="36" height="40" rx="6"/></g>
    <use href="#t" transform="rotate(45)"/><use href="#t" transform="rotate(90)"/>
    <use href="#t" transform="rotate(135)"/><use href="#t" transform="rotate(180)"/>
    <use href="#t" transform="rotate(225)"/><use href="#t" transform="rotate(270)"/>
    <use href="#t" transform="rotate(315)"/>
    <circle r="78" fill="#1A4A8E"/>
    <circle r="78" fill="none" stroke="#6FA6E0" stroke-width="4" opacity=".6"/>
  </g>

  <!-- road -->
  <path d="M96 360 H416" stroke="#6FA6E0" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <path d="M150 380 H210 M246 380 H306 M342 380 H372" stroke="#6FA6E0" stroke-width="5" stroke-linecap="round" opacity=".35"/>

  <!-- car, side view -->
  <g transform="translate(0 6)">
    <path d="M110 300 v-26 q0 -16 16 -20 l52 -12 l44 -46 q10 -10 26 -10 h70 q18 0 30 12 l40 42 l34 8 q20 6 20 26 v26 q0 10 -10 10 h-312 q-10 0 -10 -10z" fill="#0A1F45" opacity=".35" transform="translate(4 8)"/>
    <path d="M110 300 v-26 q0 -16 16 -20 l52 -12 l44 -46 q10 -10 26 -10 h70 q18 0 30 12 l40 42 l34 8 q20 6 20 26 v26 q0 10 -10 10 h-312 q-10 0 -10 -10z" fill="url(#body)"/>
    <!-- windows -->
    <path d="M196 242 l34 -36 q6 -6 16 -6 h24 v42z" fill="#9CC4EE"/>
    <path d="M284 200 h22 q10 0 18 8 l32 34 h-72z" fill="#9CC4EE"/>
    <path d="M214 232 l18 -20" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    <!-- trim -->
    <path d="M126 276 H398" stroke="#B9791C" stroke-width="4" opacity=".6"/>
    <rect x="384" y="262" width="20" height="10" rx="4" fill="#FFFFFF"/>
    <rect x="114" y="264" width="14" height="10" rx="4" fill="#E2574C"/>
    <!-- wheels -->
    <circle cx="178" cy="312" r="34" fill="#0A1F45"/>
    <circle cx="178" cy="312" r="18" fill="url(#silver)"/>
    <circle cx="178" cy="312" r="6" fill="#6B7280"/>
    <circle cx="344" cy="312" r="34" fill="#0A1F45"/>
    <circle cx="344" cy="312" r="18" fill="url(#silver)"/>
    <circle cx="344" cy="312" r="6" fill="#6B7280"/>
  </g>

  <!-- check badge -->
  <circle cx="364" cy="140" r="40" fill="#6FA6E0"/>
  <circle cx="364" cy="140" r="31" fill="url(#gold)"/>
  <path d="M349 141 l11 11 21 -23" fill="none" stroke="#0C2756" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkle dots -->
  <circle cx="132" cy="150" r="7" fill="#6FA6E0"/>
  <circle cx="114" cy="178" r="5" fill="#6FA6E0"/>
</svg>
